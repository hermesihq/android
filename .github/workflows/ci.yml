name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests on the JVM under Robolectric, with no emulator: the HTTP calls, the token
      # rotation rules, what is drawn and what a tap opens.
      - run: ./gradlew :hermesi-push:testDebugUnitTest
      # Lint, and the release artifact a consumer would actually depend on: an AAR whose manifest
      # and POM are what get merged into an app.
      - run: ./gradlew :hermesi-push:lintDebug :hermesi-push:assembleRelease
      # The sample app must keep building against the library it demonstrates (it needs no google-services.json to build).
      - run: ./gradlew :sample:assembleDebug
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The token server the sample uses: the format of the subscriber token it mints.
      - run: node --test "sample/token-server/*.test.mjs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: hermesi-push/build/reports
